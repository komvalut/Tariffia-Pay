services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tariffia
      POSTGRES_USER: tariffia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - tariffia-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tariffia -d tariffia"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 8080
      DATABASE_URL: postgres://tariffia:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/tariffia
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}
      API_KEY_PEPPER: ${API_KEY_PEPPER:?Set API_KEY_PEPPER in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      BASE_RPC_URL: ${BASE_RPC_URL:-https://mainnet.base.org}
      USDC_TOKEN_ADDRESS: ${USDC_TOKEN_ADDRESS:-0x833589fCD6eDb6E08f4c7C32d4F71b54bdA02913}
      USDC_MIN_CONFIRMATIONS: ${USDC_MIN_CONFIRMATIONS:-12}
      PAYMENT_DETECTOR_INTERVAL_MS: ${PAYMENT_DETECTOR_INTERVAL_MS:-10000}
      PAYMENT_SCAN_LOOKBACK_BLOCKS: ${PAYMENT_SCAN_LOOKBACK_BLOCKS:-100}
      PAYMENT_SCAN_BLOCK_RANGE: ${PAYMENT_SCAN_BLOCK_RANGE:-500}
      PAYMENT_EXPIRATION_MINUTES: ${PAYMENT_EXPIRATION_MINUTES:-60}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?Set WEBHOOK_ENCRYPTION_KEY in .env}
      WEBHOOK_WORKER_INTERVAL_MS: ${WEBHOOK_WORKER_INTERVAL_MS:-3000}
      WEBHOOK_MAX_ATTEMPTS: ${WEBHOOK_MAX_ATTEMPTS:-8}
      WEBHOOK_REQUEST_TIMEOUT_MS: ${WEBHOOK_REQUEST_TIMEOUT_MS:-10000}
      CREDITS_PER_USDC_RATE: ${CREDITS_PER_USDC_RATE:-100}
      CREDIT_MINIMUM_TOPUP_USDC: ${CREDIT_MINIMUM_TOPUP_USDC:-1.000000}
      CREDIT_MAXIMUM_TOPUP_USDC: ${CREDIT_MAXIMUM_TOPUP_USDC:-1000.000000}
    ports:
      - "${PORT:-8080}:8080"

volumes:
  tariffia-postgres:
